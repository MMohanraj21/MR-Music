<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20" />
      <stop offset="100%" stop-color="#05050A" />
    </linearGradient>

    <!-- Primary Accent Gradient (Pink to Cyan) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Rounded Background -->
  <rect width="500" height="500" rx="115" fill="url(#bgGrad)" />

  <!-- Centered Outer Sound Rings -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.25" />
  <circle cx="250" cy="250" r="150" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="16 10" opacity="0.4" />

  <!-- Centered & Scaled Monogram & Play Icon Group -->
  <g filter="url(#glow)" transform="translate(250, 250) scale(1.25) translate(-255, -215)">
    <!-- Equalizer Bars / Stylized 'M' & 'R' Monogram -->
    <!-- Left Bar of M -->
    <rect x="155" y="145" width="22" height="140" rx="11" fill="url(#accentGrad)" />
    
    <!-- Inner Left Wave of M -->
    <rect x="190" y="175" width="22" height="80" rx="11" fill="url(#accentGrad)" />
    
    <!-- Center Peak of M -->
    <rect x="225" y="130" width="22" height="170" rx="11" fill="url(#accentGrad)" />
    
    <!-- Right Bar of M / Stem of R -->
    <rect x="260" y="155" width="22" height="120" rx="11" fill="url(#accentGrad)" />

    <!-- Play Button / Loop of 'R' -->
    <path d="M 298 155 L 358 192 C 366 197 366 205 358 210 L 298 245 Z" fill="#00F0FF" />
    
    <!-- Leg of 'R' -->
    <path d="M 305 225 L 350 275" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>
