name: Build MR Music APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs with Gradle
        run: ./gradlew assembleGithubRelease assembleStandardRelease --stacktrace

      - name: Rename APKs
        run: |
          GITHUB_APK=$(find app/build/outputs/apk/github/release/ -type f -name "*.apk" | head -n 1)
          echo "Found GitHub APK: $GITHUB_APK"
          cp "$GITHUB_APK" app/build/outputs/apk/github/release/MR-Music-v1.0.17-release.apk

          STANDARD_APK=$(find app/build/outputs/apk/standard/release/ -type f -name "*.apk" | head -n 1)
          echo "Found Standard APK: $STANDARD_APK"
          cp "$STANDARD_APK" app/build/outputs/apk/standard/release/MR-Music-v1.0.17-standard-release.apk

          ls -lh app/build/outputs/apk/github/release/
          ls -lh app/build/outputs/apk/standard/release/

      - name: Upload MR Music APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MR-Music-v1.0.17-release-APKs
          path: |
            app/build/outputs/apk/github/release/MR-Music-v1.0.17-release.apk
            app/build/outputs/apk/standard/release/MR-Music-v1.0.17-standard-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.17
          name: "v1.0.17"
          draft: false
          prerelease: false
          body: |
            ## 🎵 MR Music v1.0.17 (Release)

            Developed and engineered by **Mohanraj.MS** (**MR Music Studio**).

            ### 📦 Two Editions Available:
            1. **Standard Edition (`MR-Music-v1.0.17-standard-release.apk`):**
               - Package ID: `com.mrmusic.player`
               - Compatible with **all Android devices** (Realme, Samsung, Xiaomi, OnePlus, Motorola, Vivo, etc.).
            2. **Vivo Origin Island Edition (`MR-Music-v1.0.17-release.apk`):**
               - Package ID: `com.spotify.music`
               - Whitelisted package specifically for Vivo OriginOS Island live notifications.

            ### ✨ Highlights & Changelog:
            - **Spotify Cleanly Removed:** All external Spotify dependencies, authorization hooks, and trackers have been completely purged from the codebase for maximum speed, security, and battery efficiency.
            - **Listen Together (Jam Session) Ready:** Added full real-time synchronized group listening architecture (Node.js + Socket.io backend and low-drift client sync hook).
            - **Ultra-Smooth Audio Engine:** Butter-smooth 60/120 FPS UI, optimized backdrop rendering, fast startup, and manual-only media scanning.
            - **Unified Release Key:** Keystore configured for hassle-free in-app updates.
          files: |
            app/build/outputs/apk/github/release/MR-Music-v1.0.17-release.apk
            app/build/outputs/apk/standard/release/MR-Music-v1.0.17-standard-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}