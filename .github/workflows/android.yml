name: Build MR Music APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleGithubDebug --stacktrace

      - name: Rename APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/github/debug/ -type f -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" app/build/outputs/apk/github/debug/MR-Music-v1.0.0.apk
          ls -lh app/build/outputs/apk/github/debug/

      - name: Upload MR Music APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR-Music-Debug-APK
          path: app/build/outputs/apk/github/debug/MR-Music-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "MR Music v1.0.0"
          draft: false
          prerelease: false
          body: |
            ## 🎵 MR Music v1.0.0
            
            Developed and engineered by **Mohanraj.MS** (**MR Music Studio**).
            
            ### ✨ Highlights
            - **Application ID:** `com.apple.android.music`
            - **Developer:** Mohanraj.MS (MR Music Studio)
            - **Custom Logo:** Neon gradient monogram & audio spectrum
            - **Engine:** High-Fidelity Lossless Audio Engine
            
            ### 📥 Direct APK Download
            Download **`MR-Music-v1.0.0.apk`** below to install directly on your Android device!
          files: app/build/outputs/apk/github/debug/MR-Music-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}